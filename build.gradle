
buildscript {
    gradle.ext.rapidwrightDir = "."
}

plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
// JReleaser adds at least an extra 20 seconds to setup time
//    id 'org.jreleaser' version '1.20.0' // Uncomment for release
}

apply from: 'common.gradle'

def mainEntrypointClassName = "com.xilinx.rapidwright.MainEntrypoint"

application {
    mainClass = mainEntrypointClassName
}

def standaloneClassName = "com.xilinx.rapidwright.StandaloneEntrypoint"

def read_rapidwright_version() {
    def sw = new StringWriter()
    file('.github/workflows/build.yml').filterLine(sw) {
        line -> line.contains('RAPIDWRIGHT_VERSION:')
    }
    return sw.toString().replace("RAPIDWRIGHT_VERSION: v", "").replace("-beta", "").trim() + ""
}
def rapidwright_version = project.hasProperty('override_rapidwright_version') ? override_rapidwright_version : read_rapidwright_version()

group = 'com.xilinx.rapidwright'
version = rapidwright_version

// Skipping test-fixtures for publication, see https://github.com/Xilinx/RapidWright/issues/697
components["java"].withVariantsFromConfiguration(configurations["testFixturesApiElements"]) { skip() }
components["java"].withVariantsFromConfiguration(configurations["testFixturesRuntimeElements"]) { skip() }

dependencies {
    api 'com.xilinx.rapidwright:rapidwright-api-lib:' + rapidwright_version
    api 'com.xilinx.rapidwright:rapidwright-api-lib:' + rapidwright_version + ':javadoc'
}

sourceSets {
  main {
    java {
      srcDirs = ['src']
    }
  }
  test {
    java {
      srcDirs = ['test/src']
    }
  }
  testFixtures {
    java {
      srcDirs = ['test/shared']
    }
    resources {
      srcDirs = ['test/resources']
    }
  }
}

tasks.named('jar', Jar) {
  archiveFileName = 'rapidwright.jar'
}

tasks.named('testJar', Jar) {
  archiveFileName = 'rapidwright-tests.jar'
}

tasks.named('testFixturesJar', Jar) {
  archiveFileName = 'rapidwright-test-fixtures.jar'
}

task copyJars(type: Copy) {
    from({
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.collect { it.file } .findAll { it.name != tasks.getByName("jar").archiveFile.get().asFile.name }
	})
	
    into 'jars'
    from({
        configurations.testFixturesRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.collect { it.file } .findAll { it.name != tasks.getByName("jar").archiveFile.get().asFile.name }
	})
    into 'jars'
}
compileJava.dependsOn(copyJars)

// External requirement: the compiled class files must be available under 'bin'.
// We deliberately do NOT set the Java compiler's destinationDirectory to 'bin':
// the incremental compiler treats its output directory as exclusively its own and
// prunes anything it did not produce, which is what randomly deleted the tracked
// bin/rapidwright[.bat] launcher scripts. Instead we compile to Gradle's default
// output directory (which the compiler can safely own and clean) and mirror the
// classes into 'bin' with a Sync that preserves the launcher scripts. Sync also
// removes stale .class files left behind by deleted/renamed sources.
task copyClassesToBin(type: Sync) {
    dependsOn(compileJava)
    from sourceSets.main.java.destinationDirectory
    into 'bin'
    preserve {
        include 'rapidwright'
        include 'rapidwright.bat'
    }
}
compileJava.finalizedBy(copyClassesToBin)

// 'clean' only removes the build directory by default. Also remove the compiled
// classes mirrored into 'bin' (all under bin/com, see copyClassesToBin) so a clean
// leaves 'bin' with just the tracked launcher scripts.
clean {
    delete 'bin/com'
}

task mainJar(type: Jar, dependsOn: classes) {
    archiveFileName = 'main.jar'
    from sourceSets.main.output include mainEntrypointClassName
    manifest {
        attributes 'Main-Class': mainEntrypointClassName
        attributes 'Class-Path': ([destinationDirectory.get().getAsFile().toPath().relativize(sourceSets.main.java.destinationDirectory.get().getAsFile().toPath()).toString() + File.separator]
            + configurations.runtimeClasspath.collect { destinationDirectory.get().getAsFile().toPath().relativize(projectDir.toPath()).resolve('jars').resolve(it.getName()) }).join(' ')
    }
}
compileJava.finalizedBy(mainJar)

task deleteJars(type: Delete) {
    delete fileTree('jars')
}

task updateJars {
  group = "build setup"
  description = "Removes all jars from RapidWright/jars and replaces with only necessary dependencies."
  dependsOn deleteJars
  dependsOn copyJars
  copyJars.mustRunAfter deleteJars
}

task update_jars {
    group = "build setup"
    description = "Alias for 'updateJars'."
    dependsOn updateJars
}

task sourceJar(type: Jar) {
  from sourceSets.main.allJava
  archiveClassifier = "sources"
}

javadoc {
    source = sourceSets.main.allJava
    classpath = configurations.runtimeClasspath
    options.addStringOption('Xdoclint:none', '-quiet')
}

task javadocJar(type: Jar) {
    from javadoc
    archiveClassifier = "javadoc"
}

task standaloneJar (type: Jar) {
    duplicatesStrategy = DuplicatesStrategy.WARN
    manifest {
        attributes 'Main-Class': standaloneClassName
    }
    archiveBaseName = 'rapidwright-'+rapidwright_version+'-standalone-' + os.charAt(0) + 'in64'
    from { configurations.implementation.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

artifacts {
    archives javadocJar
    archives sourceJar
    archives jar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourceJar
            artifact javadocJar
            // rapidwright coordinates
            groupId = "com.xilinx.rapidwright"
            artifactId = "rapidwright"
            version = rapidwright_version
            pom {
                name = "RapidWright"
                description = "Open Source companion framework for Xilinx's Vivado for customizing backend implementation"
                url = "http://rapidwright.io"
                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        name = "RapidWright Developers"
                    }
                }
                scm {
                    connection = 'scm:git@github.com:Xilinx/RapidWright.git'
                    url ='https://github.com/Xilinx/RapidWright'
                }
            }
        }
    }
    repositories {
        maven {
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

